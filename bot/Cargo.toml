[package]
name = "vigilend-bot"
version = "0.1.0"
edition = "2021"
authors = ["Vigilend Contributors"]
description = "High-performance Rust liquidation service for Vigilend Lending Protocol"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
ethers = { version = "2.0", features = ["ws", "abigen"] }
eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"

[dev-dependencies]
tokio-test = "0.4"
